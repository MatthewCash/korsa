[package]
name = "ac-linux-manager"
version = "0.1.0"
edition = "2024"
description = "A native Linux launcher and content manager for Assetto Corsa"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
anyhow = "1.0.103"
cxx = "1.0"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["full"] }
env_logger = "0.11"
log = "0.4.33"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["deflate", "gzip", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.53.0", features = ["process", "rt-multi-thread", "sync", "time"] }
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"] }

[profile.release]
lto = "thin"
strip = true
